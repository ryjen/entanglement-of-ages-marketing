[tools]
node = "24"

[tasks.deps]
description = "Install exact top-level Node dependencies"
run = "npm install --no-package-lock --no-audit --no-fund"

[tasks.source]
description = "Validate public media integrity, content model, canonical origin, manifest boundary, rights metadata, release state, production hero contract, and setting language"
depends = ["deps"]
run = "node tools/validate-media-integrity.mjs && node tools/validate-manifest-checksums.mjs && node tools/site.mjs source && node tools/validate-canonical-origin.mjs && node tools/validate-release-state.mjs && node tools/validate-public-language.mjs && node tools/validate-title-identities.mjs"

[tasks.contracts]
description = "Run Node contract tests for publication, release state, and responsive media"
depends = ["deps"]
run = "node --test tests/*.test.mjs"

[tasks.build]
description = "Build dist from manifest-backed publishable source"
depends = ["source"]
run = "node tools/site.mjs build"

[tasks.html]
description = "Validate source and manifest-backed built HTML with the pinned offline HTML validator"
depends = ["build"]
run = "npx --no-install html-validate \"src/**/*.html\" \"dist/**/*.html\""

[tasks.css]
description = "Validate source and built CSS with the pinned offline CSS validator"
depends = ["build"]
run = "npx --no-install stylelint \"src/**/*.css\" \"dist/**/*.css\""

[tasks.validate]
description = "Validate the manifest-backed built artifact and performance budgets"
depends = ["build"]
run = "node tools/site.mjs validate"

[tasks.package]
description = "Package immutable hero media into the deployment artifact and validate final HTML"
depends = ["html", "css", "validate"]
run = "node tools/version-built-media.mjs && node tools/validate-built-media.mjs && npx --no-install html-validate \"dist/**/*.html\""

[tasks."browser:install"]
description = "Install Chromium and its hosted-runner dependencies"
depends = ["deps"]
run = "npx playwright install --with-deps chromium"

[tasks.browser]
description = "Run browser smoke against the final packaged public site"
depends = ["package", "browser:install"]
run = "node tools/site.mjs browser"

[tasks.check]
description = "Run the complete public-site validation and deployment-packaging gate"
depends = ["contracts", "browser"]
run = "node --check tools/site.mjs && node --check tools/version-built-media.mjs && node --check tools/validate-built-media.mjs && node --check tools/validate-media-integrity.mjs && node --check tools/validate-manifest-checksums.mjs && node --check tools/validate-canonical-origin.mjs && node --check tools/validate-release-state.mjs && node --check tools/validate-public-language.mjs && node --check tools/validate-title-identities.mjs"
